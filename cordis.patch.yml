# DSH bundle patch: activates dsh-external-api in any profile that installs this
# package (via `dsh plugin --profile <name> add dsh-external-api`).
# The user's own cordis.patch.yml may override or disable this row by id.
- insert:
    - id: dsh-external-api
      name: 'dsh-external-api'
      config:
        enabled: false
